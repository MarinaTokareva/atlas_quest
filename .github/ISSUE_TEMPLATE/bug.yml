name: Report a problem
description: Something in Atlas Quest isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This request is public.** Please don't include your name, email address, Apple Account details or purchase receipts.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: e.g. iPhone 15, iOS 18.5
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the bottom of Settings in the app (gear icon on the Play tab).
      placeholder: e.g. 1.0
